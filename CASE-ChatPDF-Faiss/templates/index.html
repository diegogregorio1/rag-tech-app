<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChatPDF 智能问答</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
        font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
        background: #0f1222;
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }

    /* ===== 顶部栏 ===== */
    .topbar {
        background: rgba(255,255,255,.06);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid rgba(255,255,255,.08);
        padding: 14px 28px;
        display: flex;
        align-items: center;
        gap: 14px;
        color: #fff;
        flex-shrink: 0;
    }
    .logo {
        width: 42px; height: 42px;
        border-radius: 12px;
        background: linear-gradient(135deg, #6a5cff, #00d4ff);
        display: flex; align-items: center; justify-content: center;
        font-size: 20px; font-weight: 700;
        box-shadow: 0 4px 16px rgba(106,92,255,.4);
    }
    .topbar .title { font-size: 18px; font-weight: 600; }
    .topbar .subtitle { font-size: 12px; color: #9aa0c3; margin-top: 2px; }
    .pdf-chip {
        margin-left: auto;
        background: rgba(106,92,255,.15);
        border: 1px solid rgba(106,92,255,.4);
        color: #b9b3ff;
        font-size: 12px;
        padding: 6px 14px;
        border-radius: 20px;
        max-width: 45%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    /* ===== 聊天区 ===== */
    .chat-area {
        flex: 1;
        overflow-y: auto;
        padding: 28px 0;
        scroll-behavior: smooth;
    }
    .chat-inner { max-width: 860px; margin: 0 auto; padding: 0 24px; }

    .welcome {
        text-align: center;
        padding: 60px 20px;
        color: #9aa0c3;
    }
    .welcome h2 {
        font-size: 26px;
        background: linear-gradient(90deg, #8f85ff, #4dd8ff);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        margin-bottom: 12px;
    }
    .welcome p { font-size: 14px; line-height: 1.8; }
    .suggestions {
        display: flex; flex-wrap: wrap; gap: 10px;
        justify-content: center; margin-top: 24px;
    }
    .suggestion {
        background: rgba(255,255,255,.05);
        border: 1px solid rgba(255,255,255,.12);
        color: #c6c9e8;
        font-size: 13px;
        padding: 8px 16px;
        border-radius: 18px;
        cursor: pointer;
        transition: all .2s;
    }
    .suggestion:hover {
        background: rgba(106,92,255,.2);
        border-color: rgba(106,92,255,.5);
        color: #fff;
    }

    .msg { display: flex; margin-bottom: 22px; animation: fadeUp .3s ease; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .msg.user { justify-content: flex-end; }
    .avatar {
        width: 36px; height: 36px; border-radius: 10px;
        display: flex; align-items: center; justify-content: center;
        font-size: 13px; font-weight: 700; flex-shrink: 0;
    }
    .msg.ai .avatar { background: linear-gradient(135deg, #6a5cff, #00d4ff); color: #fff; margin-right: 12px; }
    .msg.user .avatar { background: rgba(255,255,255,.12); color: #dfe2ff; margin-left: 12px; order: 2; }
    .bubble {
        max-width: 76%;
        padding: 13px 18px;
        border-radius: 14px;
        font-size: 14.5px;
        line-height: 1.85;
        word-break: break-word;
        white-space: pre-wrap;
    }
    .msg.ai .bubble {
        background: rgba(255,255,255,.06);
        border: 1px solid rgba(255,255,255,.09);
        color: #e8eaf6;
        border-top-left-radius: 4px;
    }
    .msg.user .bubble {
        background: linear-gradient(135deg, #6a5cff, #5a8bff);
        color: #fff;
        border-top-right-radius: 4px;
        box-shadow: 0 4px 14px rgba(106,92,255,.3);
    }
    .sources { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .sources .src-label { font-size: 12px; color: #9aa0c3; }
    .src-badge {
        font-size: 12px;
        color: #4dd8ff;
        background: rgba(0,212,255,.1);
        border: 1px solid rgba(0,212,255,.3);
        padding: 2px 10px;
        border-radius: 12px;
    }

    /* 打字指示器 */
    .typing { display: inline-flex; gap: 5px; padding: 4px 2px; }
    .typing span {
        width: 7px; height: 7px; border-radius: 50%;
        background: #8f85ff;
        animation: blink 1.2s infinite;
    }
    .typing span:nth-child(2) { animation-delay: .2s; }
    .typing span:nth-child(3) { animation-delay: .4s; }
    @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

    /* ===== 输入区 ===== */
    .input-bar {
        flex-shrink: 0;
        padding: 16px 24px 22px;
        background: linear-gradient(to top, #0f1222 70%, transparent);
    }
    .input-box {
        max-width: 860px;
        margin: 0 auto;
        background: rgba(255,255,255,.07);
        border: 1px solid rgba(255,255,255,.14);
        border-radius: 16px;
        display: flex;
        align-items: flex-end;
        padding: 10px 10px 10px 18px;
        transition: border-color .2s;
    }
    .input-box:focus-within { border-color: rgba(106,92,255,.6); box-shadow: 0 0 0 3px rgba(106,92,255,.15); }
    .input-box textarea {
        flex: 1;
        background: transparent;
        border: none;
        outline: none;
        resize: none;
        color: #fff;
        font-size: 14.5px;
        font-family: inherit;
        line-height: 1.6;
        max-height: 120px;
        padding: 6px 0;
    }
    .input-box textarea::placeholder { color: #6b7099; }
    .send-btn {
        width: 40px; height: 40px;
        border: none; border-radius: 12px;
        background: linear-gradient(135deg, #6a5cff, #00d4ff);
        color: #fff; font-size: 17px;
        cursor: pointer; flex-shrink: 0;
        display: flex; align-items: center; justify-content: center;
        transition: transform .15s, opacity .2s;
    }
    .send-btn:hover { transform: scale(1.06); }
    .send-btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }

    /* 滚动条 */
    .chat-area::-webkit-scrollbar { width: 8px; }
    .chat-area::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 4px; }
    .chat-area::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>

<div class="topbar">
    <div class="logo">P</div>
    <div>
        <div class="title">ChatPDF 智能问答</div>
        <div class="subtitle">基于 FAISS 向量检索 + 大模型的文档问答</div>
    </div>
    <div class="pdf-chip" title="{{ pdf_name }}">{{ pdf_name }}</div>
</div>

<div class="chat-area" id="chatArea">
    <div class="chat-inner" id="chatInner">
        <div class="welcome" id="welcome">
            <h2>向文档提问</h2>
            <p>我已读取 PDF 文档内容，您可以就文档中的规定、条款、考核办法等问题进行提问，<br>回答将标注来源页码。</p>
            <div class="suggestions">
                <div class="suggestion" onclick="askSuggestion(this)">客户经理被投诉了，投诉一次扣多少分</div>
                <div class="suggestion" onclick="askSuggestion(this)">客户经理每年评聘申报时间是怎样的？</div>
                <div class="suggestion" onclick="askSuggestion(this)">工作质量考核标准包括哪些内容？</div>
            </div>
        </div>
    </div>
</div>

<div class="input-bar">
    <div class="input-box">
        <textarea id="input" rows="1" placeholder="输入你的问题，Enter 发送，Shift+Enter 换行"></textarea>
        <button class="send-btn" id="sendBtn" onclick="send()" title="发送">&#10148;</button>
    </div>
</div>

<script>
const chatArea = document.getElementById('chatArea');
const chatInner = document.getElementById('chatInner');
const input = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
let asking = false;

function escapeHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function scrollBottom() { chatArea.scrollTop = chatArea.scrollHeight; }

function hideWelcome() {
    const w = document.getElementById('welcome');
    if (w) w.remove();
}

function addUserMsg(text) {
    hideWelcome();
    const div = document.createElement('div');
    div.className = 'msg user';
    div.innerHTML = '<div class="avatar">我</div><div class="bubble">' + escapeHtml(text) + '</div>';
    chatInner.appendChild(div);
    scrollBottom();
}

function addAiMsg(answer, pages) {
    const div = document.createElement('div');
    div.className = 'msg ai';
    let srcHtml = '';
    if (pages && pages.length) {
        srcHtml = '<div class="sources"><span class="src-label">来源页码</span>' +
            pages.map(p => '<span class="src-badge">第 ' + escapeHtml(p) + ' 页</span>').join('') + '</div>';
    }
    div.innerHTML = '<div class="avatar">AI</div><div class="bubble">' + escapeHtml(answer) + srcHtml + '</div>';
    chatInner.appendChild(div);
    scrollBottom();
}

function addTyping() {
    const div = document.createElement('div');
    div.className = 'msg ai';
    div.id = 'typingMsg';
    div.innerHTML = '<div class="avatar">AI</div><div class="bubble"><span class="typing"><span></span><span></span><span></span></span></div>';
    chatInner.appendChild(div);
    scrollBottom();
}
function removeTyping() {
    const t = document.getElementById('typingMsg');
    if (t) t.remove();
}

async function send() {
    const q = input.value.trim();
    if (!q || asking) return;
    asking = true;
    sendBtn.disabled = true;
    input.value = '';
    input.style.height = 'auto';

    addUserMsg(q);
    addTyping();

    try {
        const resp = await fetch('/api/chat', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({query: q})
        });
        const data = await resp.json();
        removeTyping();
        if (!resp.ok) {
            addAiMsg('出错了：' + (data.error || '请求失败'), []);
        } else {
            addAiMsg(data.answer, data.source_pages);
        }
    } catch (e) {
        removeTyping();
        addAiMsg('网络错误：' + e.message, []);
    } finally {
        asking = false;
        sendBtn.disabled = false;
        input.focus();
    }
}

function askSuggestion(el) {
    input.value = el.textContent.trim();
    send();
}

input.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        send();
    }
});
input.addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});
input.focus();
</script>
</body>
</html>
